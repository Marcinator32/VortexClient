name: start-test

# Startet Minecraft 1.21.11 mit dem Vortex Client UND Sodium + Iris bis zum
# Ladebildschirm und prueft, dass kein Mixin-Konflikt das Spiel abstuerzen
# laesst (wie "FreecamCullMixin ... merged by ...sodium..." in 4.13.0).
# Nur manuell oder fuer Test-Branches (start-test/...) -- veroeffentlicht nichts.
on:
  workflow_dispatch:
  # Seit Oktober 2026 nur noch von Hand (Actions -> Run workflow, Branch waehlbar):
  # weniger Laeufe, so mit dem GitHub-Support abgesprochen.

permissions:
  contents: read

jobs:
  start:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-starttest-${{ hashFiles('port/1.21.11/**', 'gradle.properties') }}
          restore-keys: ${{ runner.os }}-starttest-
      - name: Grafik (Xvfb + Mesa)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb mesa-utils libgl1-mesa-dri libegl1 jq
      - name: 1.21.11-Fassung erzeugen
        run: python3 tools/port.py 1.21.11 build-port/1.21.11
      - name: Sodium und Iris (neueste fuer 1.21.11) von Modrinth
        run: |
          set -e
          M=build-port/1.21.11/run/mods; mkdir -p "$M"
          for p in sodium iris; do
            J=$(curl -sf "https://api.modrinth.com/v2/project/$p/version?game_versions=%5B%221.21.11%22%5D&loaders=%5B%22fabric%22%5D")
            V=$(echo "$J" | jq -r '.[0].version_number')
            U=$(echo "$J" | jq -r '.[0].files[] | select(.primary) | .url' | head -n 1)
            echo "$p $V"; echo "- $p $V" >> "$GITHUB_STEP_SUMMARY"
            curl -sfL "$U" -o "$M/$p.jar"
          done
      - name: Spiel starten
        run: |
          cd build-port/1.21.11
          chmod +x gradlew
          ./gradlew classes --no-daemon -q
          ( timeout 900 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient --no-daemon > run.log 2>&1 ) &
          ERGEBNIS=""
          for i in $(seq 1 180); do
            sleep 5
            L=run/logs/latest.log
            if grep -qE "Minecraft Crash Report|MixinApplyError|Mixin transformation of .* failed|InvalidInjectionException" run.log $L 2>/dev/null; then ERGEBNIS=crash; break; fi
            if grep -qE "Created: [0-9]+x[0-9]+x[0-9]+ minecraft:textures/atlas/blocks.png-atlas|Sound engine started" $L 2>/dev/null; then ERGEBNIS=ok; sleep 10; break; fi
            if ! pgrep -f "gradlew|GradleWrapperMain|KnotClient" >/dev/null && [ $i -gt 6 ]; then ERGEBNIS=beendet; break; fi
          done
          pkill -f KnotClient || true; pkill -f GradleWrapperMain || true
          echo "=== geladene Mods ==="; grep -E "Loading [0-9]+ mods" -A40 run/logs/latest.log 2>/dev/null | grep -iE "sodium|iris|vortex|Loading" | head -10 || true
          echo "=== Fehler/Warnungen zu Mixins ==="; grep -iE "mixin.*(error|fail|warn)|vortexclient.*(error|fail)" run.log run/logs/latest.log 2>/dev/null | head -40 || true
          grep -q "sodium" run/logs/latest.log 2>/dev/null || { echo "::error::Sodium wurde nicht geladen -- Test ohne Aussage"; ERGEBNIS="${ERGEBNIS:-}-ohne-sodium"; }
          echo "Ergebnis: $ERGEBNIS"; echo "**Ergebnis: $ERGEBNIS**" >> "$GITHUB_STEP_SUMMARY"
          # Kurzfassung als Annotation (ohne Log-Zugriff lesbar)
          MODS=$(grep -oE "(sodium|iris|vortexclient) [0-9][^ ]*" run/logs/latest.log 2>/dev/null | sort -u | tr '\n' ' ')
          echo "::notice::Starttest 1.21.11: $ERGEBNIS | Mods: $MODS"
          U=$(grep -hoE "(InvalidInjectionException|MixinApplyError|MixinTransformerError)[^$]{0,260}" run.log run/logs/latest.log run/crash-reports/*.txt 2>/dev/null | head -n 2 | tr '\n' ' ')
          [ -n "$U" ] && echo "::error::Ursache: $U"
          if [ "$ERGEBNIS" != ok ]; then
            echo "=== run.log (Ende) ==="; tail -120 run.log
            ls run/crash-reports 2>/dev/null && head -60 run/crash-reports/*.txt
            exit 1
          fi
