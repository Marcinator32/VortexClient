name: legacy-1.8.9

# Vortex Client fuer Minecraft 1.8.9 (Legacy Fabric, Ordner legacy/).
#  - push auf feature/legacy-*: bauen
#  - workflow_dispatch mode=devkit: zusaetzlich Minecraft 1.8.9 mit Yarn-Namen
#    (+ Quelltext) und den Klassenpfad als Release "legacy-dev" ablegen
#  - workflow_dispatch mode=test: im echten Spiel (Xvfb + Mesa) testen,
#    Ergebnis + Screenshots ins Release "legacy-tests"
on:
  # Seit Oktober 2026 nur noch von Hand (Actions -> Run workflow, Branch waehlbar):
  # weniger Laeufe, so mit dem GitHub-Support abgesprochen.
  workflow_dispatch:
    inputs:
      mode:
        description: 'build | devkit | test'
        default: 'build'
      only:
        description: 'Nur diese Tests (leer = alle)'
        default: ''

permissions:
  contents: write

jobs:
  legacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: legacy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-legacy-${{ hashFiles('legacy/*.gradle', 'legacy/gradle.properties') }}
          restore-keys: ${{ runner.os }}-legacy-
      - name: Bauen
        run: |
          chmod +x gradlew
          set -o pipefail
          for a in 1 2 3; do
            if ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log; then ok=1; break; fi
            grep -A3 -E '^/.*\.java:[0-9]+: error: ' build.log | head -60 | sed 's/^/::error::/' || true
            grep -A6 'What went wrong' build.log | head -14 | sed 's/^/::error::/' || true
            sleep 15
          done
          [ -n "$ok" ]
          ls -la build/libs
      - name: Jar fuer Tests ablegen (Release legacy-dev)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n 1)
          cp "$JAR" "$RUNNER_TEMP/vortexclient-legacy-dev.jar"
          gh release view legacy-dev >/dev/null 2>&1 || gh release create legacy-dev --prerelease --title "Legacy 1.8.9 Devkit (intern)" --notes "Nur fuer die Entwicklung."
          gh release upload legacy-dev "$RUNNER_TEMP/vortexclient-legacy-dev.jar" --clobber
      - name: Devkit (Minecraft 1.8.9 mit Namen + Quelltext)
        if: ${{ github.event.inputs.mode == 'devkit' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./gradlew genSources dumpClasspath --no-daemon -q || ./gradlew genSourcesWithVineflower dumpClasspath --no-daemon -q
          mkdir -p "$RUNNER_TEMP/devkit/cp"
          while read f; do [ -f "$f" ] && cp "$f" "$RUNNER_TEMP/devkit/cp/"; done < build/classpath.txt
          # Quelltext-Jar von Minecraft (genSources) dazulegen
          find ~/.gradle/caches/fabric-loom .gradle -name '*minecraft*sources*.jar' 2>/dev/null | head -5 | while read f; do cp "$f" "$RUNNER_TEMP/devkit/"; done
          ls -la "$RUNNER_TEMP/devkit" "$RUNNER_TEMP/devkit/cp" | head -80
          (cd "$RUNNER_TEMP" && zip -qr devkit.zip devkit)
          gh release view legacy-dev >/dev/null 2>&1 || gh release create legacy-dev --prerelease --title "Legacy 1.8.9 Devkit (intern)" --notes "Nur fuer die Entwicklung."
          gh release upload legacy-dev "$RUNNER_TEMP/devkit.zip" --clobber
      - name: Grafik (Xvfb + Mesa)
        if: ${{ github.event.inputs.mode == 'test' }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb mesa-utils libgl1-mesa-dri libegl1 libxrandr2 libxxf86vm1 libopenal1 x11-xserver-utils
      - name: Im Spiel testen
        if: ${{ github.event.inputs.mode == 'test' }}
        timeout-minutes: 40
        env:
          ONLY: ${{ github.event.inputs.only }}
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1280x720x24 +extension RANDR" ./gradlew runClient -PvortexTest ${ONLY:+-PvortexTestOnly=$ONLY} --no-daemon --stacktrace 2>&1 | tee test.log
      - name: Ergebnis einsammeln
        if: ${{ always() && github.event.inputs.mode == 'test' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OUT="$RUNNER_TEMP/legacy-tests"; mkdir -p "$OUT"
          R=$(find run -name vortex-test-results.txt | head -n 1)
          if [ -n "$R" ]; then cp "$R" "$OUT/"; { echo '```'; cat "$R"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          [ -d run/screenshots ] && cp -r run/screenshots "$OUT/"
          [ -f run/logs/latest.log ] && cp run/logs/latest.log "$OUT/"
          [ -f test.log ] && tail -c 400000 test.log > "$OUT/gradle.log"
          (cd "$RUNNER_TEMP" && zip -qr "legacy-tests-${{ github.run_number }}.zip" legacy-tests)
          gh release view legacy-tests >/dev/null 2>&1 || gh release create legacy-tests --prerelease --title "Legacy-Tests (intern)" --notes "Ergebnisse der 1.8.9-Tests. Nicht verteilen."
          gh release upload legacy-tests "$RUNNER_TEMP/legacy-tests-${{ github.run_number }}.zip" --clobber
