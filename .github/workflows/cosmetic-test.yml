name: cosmetic-test

# Cosmetics im echten Spiel (26.2, Fabric Client-Gametest): Capes, Huete,
# Song-Karte ueber dem Kopf, Menues -- als Screenshots.
# Nur manuell oder fuer Test-Branches (cosmetic-test/...) -- veroeffentlicht nichts
# ausser den Bildern im internen Release "cosmetic-tests".
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'anim = nur animierte Capes, Glanz und Song-Karte (schnell); pixel = Bandanas, Face, Back, Auras, Shields; leer = alles'
        default: 'anim'
  # Seit Oktober 2026 nur noch von Hand (Actions -> Run workflow, Branch waehlbar):
  # weniger Laeufe, so mit dem GitHub-Support abgesprochen.

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-cosmetictest-${{ hashFiles('**/*.gradle*', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-cosmetictest-
            ${{ runner.os }}-gradle-
      - name: Grafik (Xvfb + Mesa)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb mesa-utils libgl1-mesa-dri libegl1 libvulkan1 mesa-vulkan-drivers zip
      - name: Cosmetics-Test im Spiel
        timeout-minutes: 50
        env:
          VORTEX_COSMETICS_ONLY: ${{ github.event.inputs.only || 'anim' }}
        run: |
          chmod +x gradlew
          set -o pipefail
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClientGameTest -PcosmeticTests --no-daemon --stacktrace 2>&1 | tee test.log
      - name: Ergebnis einsammeln
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OUT="$RUNNER_TEMP/cosmetic-tests"; mkdir -p "$OUT"
          for d in $(find build/run -type d -name screenshots); do cp -r "$d" "$OUT/"; done
          # Grosse Bilder als JPG, sonst wird das Zip riesig
          pip install --quiet --break-system-packages pillow 2>/dev/null || pip install --quiet pillow || true
          python3 -c "
          import glob, os
          from PIL import Image
          for f in glob.glob(os.path.join('$OUT', 'screenshots', '*.png')):
              if os.path.getsize(f) > 900000:
                  Image.open(f).convert('RGB').save(f[:-4] + '.jpg', quality=90); os.remove(f)
          " || true
          L=$(find build/run -path '*logs/latest.log' | head -n 1); [ -n "$L" ] && cp "$L" "$OUT/latest.log"
          [ -f test.log ] && tail -c 400000 test.log > "$OUT/gradle.log"
          (cd "$RUNNER_TEMP" && zip -qr "cosmetic-tests-${{ github.run_number }}.zip" cosmetic-tests)
          gh release view cosmetic-tests >/dev/null 2>&1 || gh release create cosmetic-tests --prerelease --title "Cosmetics-Tests (intern)" --notes "Screenshots aus dem Cosmetics-Test im Spiel. Nicht verteilen."
          gh release upload cosmetic-tests "$RUNNER_TEMP/cosmetic-tests-${{ github.run_number }}.zip" --clobber
          gh release view cosmetic-tests --json assets --jq '.assets[].name' | grep -E '^cosmetic-tests-[0-9]+\.zip$' | sort -t- -k3 -n | head -n -10 | while read a; do gh release delete-asset cosmetic-tests "$a" -y || true; done
